services:

  postgres:
    image: postgres:14-alpine
    container_name: dojo-postgres
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dojo-redis
    restart: unless-stopped

  initializer:
    image: defectdojo/defectdojo-django:2.43.0
    container_name: dojo-initializer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DD_DATABASE_URL: "postgresql://defectdojo:defectdojo123@postgres:5432/defectdojo"
      DD_SECRET_KEY: "devsecops-secret-key-pfa-2024"
      DD_CREDENTIAL_AES_256_KEY: "1234567890123456"
      DD_ADMIN_USER: "admin"
      DD_ADMIN_PASSWORD: "admin@123"
      DD_ADMIN_FIRST_NAME: "Admin"
      DD_ADMIN_LAST_NAME: "User"
      DD_ADMIN_MAIL: "admin@devsecops.local"
      DD_INITIALIZE: "true"
    command: /entrypoint-initializer.sh
    restart: "no"

  defectdojo:
    image: defectdojo/defectdojo-django:2.43.0
    container_name: defectdojo
    depends_on:
      postgres:
        condition: service_healthy
      initializer:
        condition: service_completed_successfully
    ports:
      - "8080:8081"
    environment:
      DD_DATABASE_URL: "postgresql://defectdojo:defectdojo123@postgres:5432/defectdojo"
      DD_SECRET_KEY: "devsecops-secret-key-pfa-2024"
      DD_CREDENTIAL_AES_256_KEY: "1234567890123456"
      DD_ALLOWED_HOSTS: "*"
      DD_SESSION_COOKIE_SECURE: "False"
      DD_CSRF_COOKIE_SECURE: "False"
      DD_SECURE_SSL_REDIRECT: "False"
      DD_CELERY_BROKER_URL: "redis://redis:6379/0"
      DD_CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    volumes:
      - dojo_media:/app/media
    restart: unless-stopped

  celery-worker:
    image: defectdojo/defectdojo-django:2.43.0
    container_name: dojo-celery
    depends_on:
      - defectdojo
      - redis
      - postgres
    environment:
      DD_DATABASE_URL: "postgresql://defectdojo:defectdojo123@postgres:5432/defectdojo"
      DD_SECRET_KEY: "devsecops-secret-key-pfa-2024"
      DD_CELERY_BROKER_URL: "redis://redis:6379/0"
      DD_CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    command: /wait-for-it.sh postgres:5432 -t 30 -- celery -A dojo worker -l INFO --concurrency=3
    restart: unless-stopped

volumes:
  postgres_data:
  dojo_media:
